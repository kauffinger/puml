[package]
name = "puml-extract"
version = "0.3.1"
edition = "2024"
description = "Extracts a module/class dependency graph from a PHP/Laravel project using mago."
publish = false

[dependencies]
mago-allocator = "=1.54.0"
mago-codex = "=1.54.0"
mago-database = "=1.54.0"
mago-names = "=1.54.0"
mago-php-version = "=1.54.0"
mago-span = "=1.54.0"
mago-syntax = "=1.54.0"
mago-word = "=1.54.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
