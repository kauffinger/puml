<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>puml</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2933; }
    body { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr 360px; height: 100vh; }
    header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #d9dee3; background: #f7f9fa; }
    header h1 { font-size: 14px; margin: 0 8px 0 0; }
    header .group { display: flex; gap: 4px; align-items: center; }
    header button { font: inherit; padding: 3px 9px; border: 1px solid #b8c1ca; border-radius: 4px; background: #fff; cursor: pointer; }
    header button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    header input[type=search] { font: inherit; width: 280px; padding: 3px 6px; }
    header input[type=number] { font: inherit; width: 52px; padding: 2px 4px; }
    #kinds label { white-space: nowrap; }
    #crumbs { grid-column: 1 / 3; padding: 4px 12px; border-bottom: 1px solid #e6e9ec; color: #52606d; display: flex; gap: 16px; }
    #crumbs .stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    #crumbs .warn { color: #b42318; }
    #canvas { position: relative; overflow: hidden; background: #fff; }
    #canvas svg { width: 100%; height: 100%; display: block; cursor: grab; }
    #canvas svg .node, #canvas svg .edge { cursor: pointer; }
    #canvas svg { user-select: none; }
    #canvas svg .edge:hover path { stroke-width: 3; }
    #canvas svg .dim { opacity: .18; }
    #canvas svg .selected polygon, #canvas svg .selected path { stroke: #f59f00; stroke-width: 3; }
    #canvas .message { padding: 24px; color: #52606d; }
    aside { border-left: 1px solid #d9dee3; overflow: auto; padding: 10px 12px; background: #fbfcfd; }
    aside h2 { font-size: 13px; margin: 0 0 6px; word-break: break-all; }
    aside h3 { font-size: 12px; margin: 12px 0 4px; color: #52606d; text-transform: uppercase; letter-spacing: .04em; }
    aside ul { list-style: none; margin: 0; padding: 0; }
    aside li { padding: 2px 0; border-bottom: 1px solid #eef1f3; word-break: break-all; }
    aside code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    aside a { color: #1f6feb; cursor: pointer; text-decoration: none; }
    aside .muted { color: #7b8794; }
    aside .kind { display: inline-block; min-width: 72px; color: #52606d; }
    aside summary { cursor: pointer; }
    aside ul.evidence { margin: 2px 0 4px 14px; }
    aside ul.evidence li { border: 0; }
    #crumbs a { color: #1f6feb; cursor: pointer; }
</style>
</head>
<body>
<header>
    <h1 id="title">puml</h1>
    <div class="group" id="levels">
        <button data-level="1">1 Modules</button>
        <button data-level="2">2 Classes</button>
        <button data-level="3">3 UML</button>
    </div>
    <div class="group">
        <input type="search" id="search" list="targets" placeholder="Focus a module, namespace or class…">
        <datalist id="targets"></datalist>
    </div>
    <label><input type="checkbox" id="vendor"> vendor</label>
    <select id="editor"><option value="">no editor links</option><option value="vscode">VS Code</option><option value="cursor">Cursor</option><option value="phpstorm">PhpStorm</option></select>
    <label>budget <input type="number" id="budget" min="5" max="200"></label>
    <div class="group" id="kinds"></div>
</header>
<div id="crumbs"><span id="path"></span><span class="stats" id="stats"></span></div>
<main id="canvas"><div class="message">Loading…</div></main>
<aside id="panel"></aside>
<script id="graph" type="application/json"></script>
<script src="vendor/viz-global.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
