<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">puml: a puma drawn as a UML class</title>
  <style>
    .line { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .paper { fill: #fff; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
    .dashed { stroke-width: 2.5; stroke-linecap: butt; stroke-dasharray: 6 4; stroke-dashoffset: 8; }
    .far { opacity: .62; }
    .leg .line { stroke-width: 2.5; }
    .rule { fill: none; stroke: #c084fc; stroke-width: 1; }
    .shadow { fill: #3b0764; opacity: .32; }
    .name { font: 700 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3b0764; }
    .member { font: 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6b21a8; }
    text { text-rendering: geometricPrecision; }

    .draw { animation: draw var(--dur, .5s) var(--at) cubic-bezier(.4, 0, .2, 1) backwards; }
    .paper.draw { animation: draw var(--dur, .5s) var(--at) cubic-bezier(.4, 0, .2, 1) backwards, flood .3s calc(var(--at) + var(--dur, .5s) - .1s) ease-out backwards; }
    .rise { animation: rise .45s var(--at) cubic-bezier(.16, 1, .3, 1) backwards; }
    .shadow, .fade { animation: fade .45s var(--at) ease-out backwards; }
    .unfurl { animation: unfurl .55s var(--at) cubic-bezier(.16, 1, .3, 1) backwards; }
    .wave { animation: wave 2.2s ease-in-out infinite alternate; }
    .eye-open { transform-box: fill-box; transform-origin: center; animation: open .3s 1.6s cubic-bezier(.3, 1.5, .5, 1) backwards; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 9s 3s infinite; }
    .ear-wake { transform-origin: 249px 61px; animation: wake .5s 1.65s ease-in-out; }
    .ear-flick { transform-origin: 249px 61px; animation: flick 11s 5s infinite; }
    .head { transform-origin: 234px 72px; animation: look 13s 6s ease-in-out infinite; }
    .upper { animation: breathe 2.4s 2s ease-in-out infinite alternate; }
    .leg { transform-origin: 0 146px; animation: stretch 2.4s 2s ease-in-out infinite alternate; }

    @keyframes draw { from { stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } to { stroke-dasharray: 1 2; stroke-dashoffset: 0; } }
    @keyframes flood { from { fill-opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(3px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes unfurl { from { opacity: 0; transform: rotate(var(--u)); } 20% { opacity: 1; } }
    @keyframes wave { from { transform: rotate(calc(var(--a) * -1)); } to { transform: rotate(var(--a)); } }
    @keyframes open { from { transform: scaleY(0); } }
    @keyframes blink { 0%, 22.5%, 25.5%, 78.5%, 81%, 83.5%, 86%, 100% { transform: none; } 24%, 79.8%, 84.8% { transform: scaleY(.08); } }
    @keyframes wake { 35% { transform: rotate(-14deg); } 70% { transform: rotate(3deg); } }
    @keyframes flick { 0%, 60%, 100% { transform: none; } 61%, 63% { transform: rotate(-20deg); } 65% { transform: rotate(4deg); } 66.5% { transform: none; } }
    @keyframes look { 0%, 66%, 100% { transform: none; } 71%, 81% { transform: rotate(-4deg); } 86% { transform: none; } }
    @keyframes breathe { to { transform: translateY(-1px); } }
    @keyframes stretch { to { transform: scaleY(1.025); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r=".8" fill="#fff" fill-opacity=".16"/>
    </pattern>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="320" height="180" rx="28" fill="url(#tile)"/>
  <rect width="320" height="180" rx="28" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="319" height="179" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <ellipse class="fade" style="--at: 1s" cx="162" cy="147.5" rx="80" ry="3.5" fill="#3b0764" opacity=".35" filter="url(#soft)"/>

  <g class="leg far">
    <path class="shadow" style="--at: 1.2s" d="M122 142 h14 v6 h-14 Z"/>
    <path class="line draw" style="--at: 0.6s" pathLength="1" d="M124 118 L118 131 L125 140"/>
    <path class="paper draw" style="--at: 0.5s" pathLength="1" d="M124 106 L128 112 L124 118 L120 112 Z"/>
    <path class="paper draw" style="--at: 0.9s" pathLength="1" d="M120 140 H134 V146 H120 Z"/>
  </g>
  <g class="leg far">
    <path class="shadow" style="--at: 1.2s" d="M188 142 h14 v6 h-14 Z"/>
    <path class="line draw" style="--at: 0.7s" pathLength="1" d="M196 118 L191 140"/>
    <path class="paper draw" style="--at: 0.55s" pathLength="1" d="M196 106 L200 112 L196 118 L192 112 Z"/>
    <path class="paper draw" style="--at: 0.9s" pathLength="1" d="M186 140 H200 V146 H186 Z"/>
  </g>

  <g class="upper">
    <g class="unfurl" style="--at: 0.85s; --u: 10deg; transform-origin: 92px 66px">
      <g class="wave" style="--a: 1.5deg; animation-delay: 0.00s; transform-origin: 92px 66px">
        <path class="line dashed" pathLength="30" d="M92 66 C79.7 66 70.4 72 65.1 81.8"/>
        <g class="unfurl" style="--at: 0.97s; --u: 18deg; transform-origin: 65.1px 81.8px">
          <g class="wave" style="--a: 3deg; animation-delay: -0.35s; transform-origin: 65.1px 81.8px">
            <path class="line dashed" pathLength="30" d="M65.1 81.8 C61.8 87.9 60 95.5 60 104 C60 107.5 59.8 110.8 59.4 113.8"/>
            <g class="unfurl" style="--at: 1.09s; --u: 26deg; transform-origin: 59.4px 113.8px">
              <g class="wave" style="--a: 5deg; animation-delay: -0.70s; transform-origin: 59.4px 113.8px">
                <path class="line dashed" pathLength="30" d="M59.4 113.8 C57.8 127.4 52.4 136.9 42.4 139.5"/>
                <g class="unfurl" style="--at: 1.21s; --u: 34deg; transform-origin: 42.4px 139.5px">
                  <g class="wave" style="--a: 8deg; animation-delay: -1.05s; transform-origin: 42.4px 139.5px">
                    <path class="line dashed" pathLength="30" d="M42.4 139.5 C41.6 139.7 40.8 139.9 40 140 C28 141 22 132 24 120"/>
                    <path class="line" d="M27.6 128.7 L24 120 L17.8 127.1"/>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <path class="shadow" style="--at: 1.1s" d="M95 61 H223 V109 H95 Z"/>
    <path class="paper draw" style="--at: 0s; --dur: .7s" pathLength="1" d="M92 58 H220 V106 H92 Z"/>
    <path class="rule draw" style="--at: .95s" pathLength="1" d="M93 76.5 H219"/>
    <path class="rule draw" style="--at: 1.05s" pathLength="1" d="M93 91.5 H219"/>
    <text class="name rise" style="--at: 1.05s" x="156" y="71.5" text-anchor="middle">Puma</text>
    <text class="member rise" style="--at: 1.15s" x="99" y="86.5">- claws: 18</text>
    <text class="member rise" style="--at: 1.25s" x="99" y="101.5">+ pounce()</text>

    <path class="paper draw" style="--at: .45s" pathLength="1" d="M220 72 L227 67.5 L234 72 L227 76.5 Z"/>

    <g class="head">
      <g class="far"><path class="paper draw" style="--at: .75s" pathLength="1" d="M236 61 L241 48 L246 61"/></g>
      <path class="shadow" style="--at: 1.15s" d="M237 64 H271 V77 H282 L289 84 V95 H237 Z"/>
      <path class="paper draw" style="--at: .55s" pathLength="1" d="M234 61 H268 V74 H279 L286 81 V92 H234 Z"/>
      <g class="ear-wake"><g class="ear-flick">
        <path class="paper draw" style="--at: .85s" pathLength="1" d="M243 61 L249 46 L255 61"/>
        <path class="rule draw" style="--at: 1.2s; stroke-linejoin: round" pathLength="1" d="M246 59.8 L249 52.3 L252 59.8"/>
      </g></g>
      <path class="rule draw" style="--at: 1.1s" pathLength="1" d="M235 74.5 H267"/>
      <path class="rise" style="--at: 1.15s" d="M280 75.5 V80 H284.5 Z" fill="#ede9fe" stroke="#d8b4fe" stroke-width="1.2" stroke-linejoin="round"/>
      <g class="eye-open"><g class="eye">
        <path d="M250.2 68 Q256.4 62.6 262.7 67.5 Q256.4 71.3 250.2 68 Z" fill="#fbbf24" stroke="#3b0764" stroke-width="1.1" stroke-linejoin="round"/>
        <ellipse cx="257.4" cy="67.7" rx="1.05" ry="2.45" fill="#3b0764"/>
      </g></g>
      <path class="rise" style="--at: 1.25s" d="M282 82.6 H285.6 V86.2 Z" fill="#3b0764" stroke="#3b0764" stroke-width="1" stroke-linejoin="round"/>
      <path class="line draw" style="--at: 1.3s; stroke-width: 1.1" pathLength="1" d="M288 85 L302 80.5"/>
      <path class="line draw" style="--at: 1.35s; stroke-width: 1.1" pathLength="1" d="M288 88 L302 90.5"/>
    </g>
  </g>

  <g class="leg">
    <path class="shadow" style="--at: 1.2s" d="M103 142 h14 v6 h-14 Z"/>
    <path class="line draw" style="--at: 0.7s" pathLength="1" d="M110 118 L101 131 L106 140"/>
    <path class="paper draw" style="--at: 0.6s" pathLength="1" d="M110 106 L114 112 L110 118 L106 112 Z"/>
    <path class="paper draw" style="--at: 1s" pathLength="1" d="M101 140 H115 V146 H101 Z"/>
  </g>
  <g class="leg">
    <path class="shadow" style="--at: 1.2s" d="M212 142 h14 v6 h-14 Z"/>
    <path class="line draw" style="--at: 0.8s" pathLength="1" d="M208 118 L213 130 L215 140"/>
    <path class="paper draw" style="--at: 0.65s" pathLength="1" d="M208 106 L212 112 L208 118 L204 112 Z"/>
    <path class="paper draw" style="--at: 1s" pathLength="1" d="M210 140 H224 V146 H210 Z"/>
  </g>
</svg>
