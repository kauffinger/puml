<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="-4 12 320 180" role="img" aria-labelledby="title">
  <title id="title">puml: a puma drawn as a UML class</title>
  <style>
    .line { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.2; }
    .box { fill: #fff; fill-opacity: .14; }
    .solid { fill: #fff; }
    .name { font: 700 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fff; }
    .member { font: 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #fff; }

    .draw { stroke-dasharray: 1 2; animation: draw .5s var(--at) ease-out backwards; }
    .fade { animation: fade .4s 1.1s ease-out backwards; }
    .tail-line { stroke-linecap: butt; stroke-dasharray: 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 4 5 140; animation: extrude .7s .9s ease-out backwards; }
    .tail { transform-origin: 88px 70px; animation: swish 2.4s 1.6s ease-in-out infinite alternate; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s 2.6s infinite; }
    .ear { transform-origin: 257px 60px; animation: twitch 7s 3.4s infinite; }

    @keyframes draw { from { stroke-dashoffset: 1; fill-opacity: 0; opacity: 0; } 1% { opacity: 1; } 70% { fill-opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes extrude { from { stroke-dashoffset: 135; } }
    @keyframes swish { to { transform: rotate(6deg); } }
    @keyframes blink { 0%, 94%, 100% { transform: none; } 97% { transform: scaleY(.1); } }
    @keyframes twitch { 0%, 90%, 100% { transform: none; } 93% { transform: rotate(-16deg); } 96% { transform: rotate(4deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <rect x="-4" y="12" width="320" height="180" rx="28" fill="url(#tile)"/>

  <g class="tail">
    <path class="line tail-line" pathLength="135" d="M88 70 C66 72 56 94 58 118 C60 140 48 152 32 150 C22 148 18 140 18 130"/>
    <path class="line draw" style="--at: 1.5s" pathLength="1" d="M13 138 L18 130 L23 138"/>
  </g>

  <path class="line solid draw" style="--at: .5s" pathLength="1" d="M108 112 L112 118 L108 124 L104 118 Z"/>
  <path class="line draw" style="--at: .6s" pathLength="1" d="M108 124 L94 140 L98 152"/>
  <path class="line solid draw" style="--at: .55s" pathLength="1" d="M122 112 L126 118 L122 124 L118 118 Z"/>
  <path class="line draw" style="--at: .65s" pathLength="1" d="M122 124 L110 140 L116 152"/>
  <path class="line solid draw" style="--at: .6s" pathLength="1" d="M196 112 L200 118 L196 124 L192 118 Z"/>
  <path class="line draw" style="--at: .7s" pathLength="1" d="M196 124 L194 152"/>
  <path class="line solid draw" style="--at: .65s" pathLength="1" d="M210 112 L214 118 L210 124 L206 118 Z"/>
  <path class="line draw" style="--at: .75s" pathLength="1" d="M210 124 L218 152"/>
  <path class="line box draw" style="--at: .9s" pathLength="1" d="M94 152 H105 V157 H94 Z"/>
  <path class="line box draw" style="--at: .95s" pathLength="1" d="M112 152 H123 V157 H112 Z"/>
  <path class="line box draw" style="--at: 1s" pathLength="1" d="M190 152 H201 V157 H190 Z"/>
  <path class="line box draw" style="--at: 1.05s" pathLength="1" d="M214 152 H225 V157 H214 Z"/>

  <path class="line box draw" style="--at: 0s; animation-duration: .7s" pathLength="1" d="M88 62 H224 V112 H88 Z"/>
  <path class="line draw" style="--at: .4s" pathLength="1" d="M88 80 H224"/>
  <path class="line draw" style="--at: .5s" pathLength="1" d="M88 96 H224"/>

  <path class="line solid draw" style="--at: .6s" pathLength="1" d="M224 74 L231 69.5 L238 74 L231 78.5 Z"/>
  <path class="line box draw" style="--at: .7s" pathLength="1" d="M238 60 H272 V72 H280 L285 77 V90 H238 Z"/>
  <path class="line draw" style="--at: .95s" pathLength="1" d="M238 72 H272"/>
  <path class="line thin solid draw" style="--at: 1.1s" pathLength="1" d="M280 72 V77 H285 Z"/>
  <path class="line box draw" style="--at: 1s" pathLength="1" d="M241 60 L246 47 L251 60"/>
  <g class="ear"><path class="line box draw" style="--at: 1.05s" pathLength="1" d="M252 60 L257 48 L262 60"/></g>
  <g class="fade"><path class="eye solid" d="M256 66.5 Q262 62 268 66 Q262 69 256 66.5 Z"/></g>
  <path class="line thin draw" style="--at: 1.15s" pathLength="1" d="M285 80 L299 76"/>
  <path class="line thin draw" style="--at: 1.2s" pathLength="1" d="M285 84 L299 86"/>

  <g class="fade">
    <text class="name" x="156" y="75.5" text-anchor="middle">Puma</text>
    <text class="member" x="95" y="91.5">- claws: 18</text>
    <text class="member" x="95" y="107.5">+ pounce()</text>
  </g>
</svg>
