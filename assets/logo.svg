<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">puml: a puma drawn as a UML class</title>
  <style>
    .line { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .dashed { stroke-linecap: butt; stroke-dasharray: 7 3; stroke-dashoffset: 8.5; }
    .paper { fill: #fff; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ear { fill: #c084fc; }
    .rule { fill: none; stroke: #c084fc; stroke-width: 1; }
    .ink { fill: #3b0764; }
    .eye { fill: #fbbf24; stroke: #3b0764; stroke-width: 1; stroke-linejoin: round; }
    .nose { fill: #3b0764; stroke: #3b0764; stroke-width: 1; stroke-linejoin: round; }
    .lid { fill: none; stroke: #3b0764; stroke-width: 1; stroke-linecap: round; }
    .shadow { fill: #3b0764; stroke: #3b0764; stroke-width: 2; stroke-linejoin: round; opacity: .32; }
    .far { opacity: .6; }
    .whisker { stroke-width: 1; }

    .draw { animation: draw var(--dur) var(--at) cubic-bezier(.45, 0, .25, 1) backwards; }
    .paper.draw, .ear.draw { animation: draw var(--dur) var(--at) cubic-bezier(.45, 0, .25, 1) backwards, flood 0.24s calc(var(--at) + var(--dur)) cubic-bezier(.45, 0, .25, 1) backwards; }
    .rise { animation: rise 0.3s var(--at) cubic-bezier(.45, 0, .25, 1) backwards; }
    .fade { animation: fade 0.24s var(--at) cubic-bezier(.45, 0, .25, 1) backwards; }
    .shadow { animation: fade 0.36s var(--at) cubic-bezier(.45, 0, .25, 1) backwards; }
    .unfurl { animation: unfurl 0.48s var(--at) cubic-bezier(.45, 0, .25, 1) backwards; }
    .wake { transform-origin: 256px 70px; animation: wake 0.44s 1.62s ease-in-out backwards; }
    .open { transform-box: fill-box; transform-origin: 50% 85%; animation: open 0.3s 1.56s cubic-bezier(.3, 1.4, .5, 1) backwards; }

    .upper, .breathe { animation: breathe 2.4s 2.06s ease-in-out infinite alternate; }
    .stretch { transform-origin: 0 129px; animation: stretch 2.4s 2.06s ease-in-out infinite alternate; }
    .wave { animation: wave 2.2s ease-in-out infinite alternate; }
    .blink { transform-box: fill-box; transform-origin: 50% 85%; animation: blink 14.4s 2.06s ease-in-out infinite; }
    .flick { transform-origin: 256px 70px; animation: flick 14.4s 2.06s ease-in-out infinite; }
    .head { transform-origin: 234px 81px; animation: look 14.4s 2.06s ease-in-out infinite; }

    @keyframes draw { from { stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } to { stroke-dasharray: 1 2; stroke-dashoffset: 0; } }
    @keyframes flood { from { fill-opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(2px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes unfurl { from { opacity: 0; transform: rotate(var(--u)); } 30% { opacity: 1; } }
    @keyframes open { from { transform: scaleY(.1); } }
    @keyframes wake { 30% { transform: rotate(-14deg); } 65% { transform: rotate(3deg); } }
    @keyframes breathe { to { transform: translateY(-1px); } }
    @keyframes stretch { to { transform: scaleY(1.0625); } }
    @keyframes wave { to { transform: rotate(var(--a)); } }
    @keyframes blink { 0%, 16.667%, 18.333%, 89.583%, 91.25%, 92.361%, 94.028%, 100% { transform: none; } 17.292%, 17.5%, 90.208%, 90.417%, 92.986%, 93.194% { transform: scaleY(.1); } }
    @keyframes flick { 0%, 37.5%, 39.931%, 100% { transform: none; } 37.986%, 38.403% { transform: rotate(-18deg); } 39.097% { transform: rotate(4deg); } }
    @keyframes look { 0%, 66.667%, 84.028%, 100% { transform: none; } 70.833%, 79.167% { transform: rotate(-4deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
